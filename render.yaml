services:
  # 1. FastAPI Backend API Web Service
  - type: web
    name: antigravity-money-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: antigravity-money-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: CORS_ALLOWED_ORIGINS
        value: https://antigravity-money.onrender.com,http://localhost:5173

  # 2. React / Vite Frontend Static Site
  - type: web
    name: antigravity-money-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: antigravity-money-backend
          property: host

databases:
  - name: antigravity-money-db
    databaseName: money_management
    user: postgres
    plan: free
