services:
  # Unified Production Web Service (serves both React frontend and FastAPI backend)
  - type: web
    name: wealth-tracker
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wealth-tracker-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: CORS_ALLOWED_ORIGINS
        value: https://wealth-tracker.onrender.com,http://localhost:5173,http://localhost:8000

databases:
  - name: wealth-tracker-db
    databaseName: wealth_tracker
    user: postgres
    plan: free
